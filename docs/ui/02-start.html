<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>画面案：台を打ち始める</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<style>html{background:#D9D9D3}body{display:flex;justify-content:center}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F1; font-family: 'Noto Sans JP', sans-serif; color: #17191D; display: flex; flex-direction: column; gap: 20px; padding: 56px 20px 36px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="01-today.html" aria-label="戻る" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">台を打ち始める</h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="store" style="font-size: 13px; font-weight: 500; color: #5A5F68">店舗</label>
    <input id="store" value="[店舗名]" style="height: 48px; box-sizing: border-box; border: 1px solid #DCDCD6; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 17px; color: #17191D">
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; font-weight: 500; color: #5A5F68">レート</div>
    <div style="display: grid; grid-template-columns: 72px repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center">
      <div style="font-size: 13px; color: #5A5F68">パチンコ</div>
      <button style="height: 44px; border-radius: 10px; border: 2px solid #17191D; background: #17191D; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">4円</button>
      <button style="height: 44px; border-radius: 10px; border: 1px solid #DCDCD6; background: #FFFFFF; color: #17191D; font: inherit; font-size: 16px">2円</button>
      <button style="height: 44px; border-radius: 10px; border: 1px solid #DCDCD6; background: #FFFFFF; color: #17191D; font: inherit; font-size: 16px">1円</button>
      <div style="font-size: 13px; color: #5A5F68">スロット</div>
      <button style="height: 44px; border-radius: 10px; border: 1px solid #DCDCD6; background: #FFFFFF; color: #17191D; font: inherit; font-size: 16px">20円</button>
      <button style="height: 44px; border-radius: 10px; border: 1px solid #DCDCD6; background: #FFFFFF; color: #17191D; font: inherit; font-size: 16px">10円</button>
      <button style="height: 44px; border-radius: 10px; border: 1px solid #DCDCD6; background: #FFFFFF; color: #17191D; font: inherit; font-size: 16px">5円</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="machine" style="font-size: 13px; font-weight: 500; color: #5A5F68">機種</label>
    <input id="machine" value="り" style="height: 48px; box-sizing: border-box; border: 2px solid #17191D; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 17px; color: #17191D">
    <div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #DCDCD6; border-radius: 12px; overflow: hidden">
      <button style="display: flex; justify-content: space-between; align-items: center; height: 48px; padding: 0 14px; border: 0; border-bottom: 1px solid #ECECE7; background: #FFFFFF; font: inherit; font-size: 16px; color: #17191D; text-align: left"><span><b>リ</b>ゼロ2</span><span style="font-size: 12px; color: #5A5F68">前回 10/12</span></button>
      <button style="display: flex; align-items: center; height: 48px; padding: 0 14px; border: 0; background: #FFFFFF; font: inherit; font-size: 15px; color: #3A3F47; text-align: left">「り」を新しい機種として入力</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="startSpin" style="font-size: 13px; font-weight: 500; color: #5A5F68">開始回転数（パチンコのみ・任意）</label>
    <input id="startSpin" inputmode="numeric" value="120" style="height: 48px; box-sizing: border-box; border: 1px solid #DCDCD6; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 17px; color: #17191D; text-align: right">
  </div>

  <a href="01-today.html" style="margin-top: auto; display: flex; justify-content: center; align-items: center; height: 60px; border-radius: 16px; background: #17191D; color: #FFFFFF; font-size: 18px; font-weight: 700">打ち始める</a>
</div>
</body>
</html>
