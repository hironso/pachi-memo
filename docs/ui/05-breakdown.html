<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>画面案：内訳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<style>html{background:#D9D9D3}body{display:flex;justify-content:center}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F1; font-family: 'Noto Sans JP', sans-serif; color: #17191D; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 56px 20px 16px; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E6E6E0; border-radius: 12px">
      <button style="height: 36px; border: 0; border-radius: 9px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #17191D">機種別</button>
      <button style="height: 36px; border: 0; border-radius: 9px; background: transparent; font: inherit; font-size: 14px; color: #3A3F47">店舗別</button>
      <button style="height: 36px; border: 0; border-radius: 9px; background: transparent; font: inherit; font-size: 14px; color: #3A3F47">レート別</button>
    </div>

    <div style="display: flex; gap: 8px">
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid #17191D; background: #17191D; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700">今月</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #DCDCD6; background: #FFFFFF; color: #17191D; font: inherit; font-size: 13px">今年</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #DCDCD6; background: #FFFFFF; color: #17191D; font: inherit; font-size: 13px">全期間</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <button style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #DCDCD6; border-radius: 16px; font: inherit; color: #17191D; text-align: left">
        <span style="display: flex; justify-content: space-between; width: 100%"><span style="font-size: 17px; font-weight: 700">海物語</span><span style="font-size: 20px; font-weight: 700; color: #1D5FD1">+13,000</span></span>
        <span style="display: flex; justify-content: space-between; width: 100%; font-size: 13px; color: #5A5F68"><span>4円パチンコ ・ 2回</span><span>平均 +6,500</span></span>
      </button>
      <button style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #DCDCD6; border-radius: 16px; font: inherit; color: #17191D; text-align: left">
        <span style="display: flex; justify-content: space-between; width: 100%"><span style="font-size: 17px; font-weight: 700">リゼロ2</span><span style="font-size: 20px; font-weight: 700; color: #1D5FD1">+5,000</span></span>
        <span style="display: flex; justify-content: space-between; width: 100%; font-size: 13px; color: #5A5F68"><span>20円スロット ・ 2回</span><span>平均 +2,500</span></span>
      </button>
      <button style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #DCDCD6; border-radius: 16px; font: inherit; color: #17191D; text-align: left">
        <span style="display: flex; justify-content: space-between; width: 100%"><span style="font-size: 17px; font-weight: 700">まどマギ</span><span style="font-size: 20px; font-weight: 700; color: #C8322F">−6,000</span></span>
        <span style="display: flex; justify-content: space-between; width: 100%; font-size: 13px; color: #5A5F68"><span>20円スロット ・ 1回</span><span>平均 −6,000</span></span>
      </button>
    </div>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; height: 84px; padding-bottom: 20px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #DCDCD6">
    <a href="01-today.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #6A6F78">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg>今日</a>
    <a href="04-history.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #6A6F78">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>履歴</a>
    <a href="05-breakdown.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; color: #17191D">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg>内訳</a>
    <a href="05-breakdown.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #6A6F78">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>設定</a>
  </nav>
</div>
</body>
</html>
