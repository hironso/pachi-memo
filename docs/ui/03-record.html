<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>画面案：台の記録（回転率・投資・回収）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<style>html{background:#D9D9D3}body{display:flex;justify-content:center}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F1; font-family: 'Noto Sans JP', sans-serif; color: #17191D; display: flex; flex-direction: column; gap: 14px; padding: 52px 20px 28px; font-variant-numeric: tabular-nums">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="01-today.html" aria-label="戻る" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">海物語 <span style="font-size: 14px; font-weight: 500; color: #5A5F68">2台目</span></h1>
      <div style="font-size: 13px; color: #5A5F68">4円パチンコ ・ [店舗名] ・ 開始 120回</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #FFFFFF; border: 2px solid #17191D; border-radius: 16px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 13px; font-weight: 500; color: #5A5F68">回転率</span>
      <span style="font-size: 12px; color: #5A5F68">3,000円で55回転</span>
    </div>
    <div style="font-size: 36px; font-weight: 700; line-height: 1.1">18.3<span style="font-size: 15px; font-weight: 500; color: #5A5F68"> 回／千円</span></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 3px; background: #E6E6E0; border-radius: 10px">
      <button style="height: 32px; border: 0; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: #17191D">現金</button>
      <button style="height: 32px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 13px; color: #3A3F47">持ち玉</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="spin" style="font-size: 12px; color: #5A5F68">現在の回転数</label>
        <input id="spin" inputmode="numeric" value="175" style="height: 44px; box-sizing: border-box; border: 1px solid #DCDCD6; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 18px; text-align: right; color: #17191D">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="spinInv" style="font-size: 12px; color: #5A5F68">ここまでの投資（円）</label>
        <input id="spinInv" inputmode="numeric" value="3,000" style="height: 44px; box-sizing: border-box; border: 1px solid #DCDCD6; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 18px; text-align: right; color: #17191D">
      </div>
    </div>
    <button style="height: 44px; border: 0; border-radius: 10px; background: #17191D; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">計算する</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="inv" style="font-size: 13px; font-weight: 500; color: #5A5F68">投資額（打ち終わったら）</label>
    <div style="display: flex; align-items: center; height: 52px; box-sizing: border-box; border: 1px solid #DCDCD6; border-radius: 12px; background: #FFFFFF; padding: 0 16px; gap: 8px">
      <input id="inv" inputmode="numeric" placeholder="未入力" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 20px; font-weight: 700; color: #17191D; text-align: right">
      <span style="font-size: 16px; color: #5A5F68">円</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="height: 44px; border-radius: 10px; border: 1px solid #DCDCD6; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; color: #17191D">+1,000</button>
      <button style="height: 44px; border-radius: 10px; border: 1px solid #DCDCD6; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; color: #17191D">+10,000</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="pay" style="font-size: 13px; font-weight: 500; color: #5A5F68">回収額（換金したら）</label>
    <div style="display: flex; align-items: center; height: 52px; box-sizing: border-box; border: 1px solid #DCDCD6; border-radius: 12px; background: #FFFFFF; padding: 0 16px; gap: 8px">
      <input id="pay" inputmode="numeric" placeholder="あとで入力できます" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 16px; color: #17191D; text-align: right">
      <span style="font-size: 16px; color: #5A5F68">円</span>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px">
    <a href="01-today.html" style="display: flex; justify-content: center; align-items: center; height: 56px; border-radius: 16px; background: #17191D; color: #FFFFFF; font-size: 18px; font-weight: 700">保存</a>
    <button style="height: 44px; border: 0; background: transparent; font: inherit; font-size: 14px; color: #A82724">この記録を削除</button>
  </div>
</div>
</body>
</html>
